<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Solid Dark Background -->
  <rect width="400" height="400" fill="#0d1117" />

  <!-- Centered Isometric Wireframe Package Box -->
  <g transform="translate(200, 200)" stroke="rgba(255, 255, 255, 0.4)" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Box Outer Cube -->
    <path d="M 0 -48 L 42 -24 L 42 24 L 0 48 L -42 24 L -42 -24 Z" />
    <!-- Center Dividing Edges -->
    <path d="M 0 -48 L 0 48" />
    <path d="M 0 0 L 42 -24" />
    <path d="M 0 0 L -42 -24" />
    <!-- Tape / Package Detail -->
    <path d="M -21 -12 L 21 -36" stroke="rgba(255, 255, 255, 0.25)" stroke-width="1.25" />
    <path d="M -21 36 L 21 12" stroke="rgba(255, 255, 255, 0.25)" stroke-width="1.25" />
  </g>
</svg>

