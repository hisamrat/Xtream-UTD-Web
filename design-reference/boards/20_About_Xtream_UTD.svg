acing="0">≡</text><text x="40" y="180" font-family="Arial, Helvetica, sans-serif" font-size="66" font-weight="850" fill="#F5F1E8" text-anchor="start" opacity="1" letter-spacing="-2">Useful products,</text><text x="40" y="252" font-family="Arial, Helvetica, sans-serif" font-size="66" font-weight="850" fill="#FF6B45" text-anchor="start" opacity="1" letter-spacing="-2">chosen for everyday life.</text><text x="780" y="180" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600" fill="#F5F1E8" text-anchor="start" opacity="1" letter-spacing="0">Xtream UTD curates trendy gadgets and accessories for desks, homes, travel and everyday routines.</text><text x="780" y="270" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#979AA3" text-anchor="start" opacity="1" letter-spacing="0">The brand promise is simple: useful products, clear pricing and responsive support across Bangladesh.</text><line x1="40" y1="370" x2="1400" y2="370" stroke="#30343C" stroke-width="1" opacity="1"/><rect x="40" y="450" width="640" height="200" rx="14" fill="#13151A" stroke="#30343C" stroke-width="1" opacity="1"/><text x="64" y="492" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="800" fill="#FF6B45" text-anchor="start" opacity="1" letter-spacing="1.3">PRODUCT QUALITY</text><text x="64" y="540" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#F5F1E8" text-anchor="start" opacity="1" letter-spacing="0">Practical items selected for function, finish and value.</text><rect x="720" y="450" width="640" height="200" rx="14" fill="#13151A" stroke="#30343C" stroke-width="1" opacity="1"/><text x="744" y="492" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="800" fill="#FF6B45" text-anchor="start" opacity="1" letter-spacing="1.3">AFFORDABLE PRICING</text><text x="744" y="540" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#F5F1E8" text-anchor="start" 